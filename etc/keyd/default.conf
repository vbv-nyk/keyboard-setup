[ids]
*

# --- Ctrl+W -> Ctrl+Backspace, system-wide -----------------------------------
# Deletes the previous word in GUI apps instead of closing the tab/window.
# Terminals undo this on the wire (see snippets/) so shells and neovim still
# receive a genuine 0x17 (^W).
[control]
w = C-backspace

# --- Shift+Escape+hjkl navigation --------------------------------------------
# NOTE ON KEY NAMES: keyd reads raw evdev keycodes, BELOW XKB. If you swap Caps
# and Escape with `caps:swapescape` (XKB / Hyprland kb_options / setxkbmap),
# keyd does not see that swap. The key you press as Escape is physically
# CapsLock, so it must be named `capslock` here, not `esc`.
#
# Escape is NOT overloaded. Pressed alone this key passes straight through to
# XKB and produces a plain, instant Escape -- no tap/hold, no timeout, so it
# can never leak into a text field or drop you out of insert mode. It only
# becomes a layer key while Shift is already held.
#
# The layer is composite ([shift+escl]) rather than plain, because keyd
# preserves explicitly-held modifiers: a plain layer would emit Shift+Left
# (extend selection) instead of Left. Composite layers ignore the modifiers of
# their constituents, so the arrows come out unmodified.
[shift]
capslock = layer(escl)

[escl]

[shift+escl]
h = left
j = down
k = up
l = right

# If you do NOT swap Caps and Escape, change the line above to `esc = layer(escl)`
# and this binds the real Escape key instead.
